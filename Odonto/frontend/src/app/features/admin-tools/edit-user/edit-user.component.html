<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Editar Usuário</h1>
      <p class="lead text-muted">Modifique as informações do usuário selecionado.</p>
    </div>
    <a routerLink="/admin/gerenciar-usuarios" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-2"></i>Voltar para Gerenciar Usuários
    </a>
  </div>

  <div *ngIf="!user; else userForm" class="alert alert-warning text-center">
    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
    Carregando dados do usuário...
  </div>

  <ng-template #userForm>
    <div class="card shadow-sm">
      <div class="card-header">
        <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editando: {{ user?.nome }}</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <!-- Nome -->
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome Completo</label>
              <input type="text" id="nome" class="form-control" formControlName="nome">
            </div>

            <!-- Email -->
            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" formControlName="email">
            </div>

            <!-- Perfil (Role) -->
            <div class="col-md-6">
              <label for="role" class="form-label">Perfil (Role)</label>
              <select id="role" class="form-select" formControlName="role">
                <option value="paciente">Paciente</option>
                <option value="atendente">Atendente</option>
                <option value="dentista">Dentista</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-end gap-2">
            <a routerLink="/admin/gerenciar-usuarios" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || !editForm.dirty">
              <i class="bi bi-save-fill me-2"></i>Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>
  </ng-template>
</div>
