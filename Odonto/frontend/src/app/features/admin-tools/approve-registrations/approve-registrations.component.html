<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Analisar Cadastros Pendentes</h1>
      <p class="lead text-muted">Aprove ou rejeite novos usuários que se cadastraram no sistema.</p>
    </div>
    <a routerLink="/dashboard/admin" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-2"></i>Voltar ao Painel Admin
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-header">
      <h4 class="mb-0"><i class="bi bi-person-check-fill me-2"></i>Usuários Aguardando Aprovação</h4>
    </div>
    <div class="card-body">
      <ul class="list-group list-group-flush">
        <li *ngFor="let user of pendingUsers" class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">{{ user.nome }}</h5>
            <p class="mb-1 text-muted">
              Email: {{ user.email }} | Perfil Solicitado: <span class="fw-bold">{{ user.role | titlecase }}</span>
            </p>
          </div>
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-sm btn-outline-success" (click)="approve(user.id)">
              <i class="bi bi-check-lg me-1"></i> Aprovar
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="reject(user.id)">
              <i class="bi bi-x-lg me-1"></i> Rejeitar
            </button>
          </div>
        </li>
        <li *ngIf="pendingUsers.length === 0" class="list-group-item text-center text-muted">
          Nenhum cadastro pendente no momento.
        </li>
      </ul>
    </div>
  </div>
</div>
