<div class="login-page">
  <div class="auth-wrapper">
    <div class="mb-3">
      <button class="btn btn-outline-primary w-10 return" routerLink="/home">
        Voltar para o Início
      </button>
    </div>
    <div class="login-container">
      <div class="header">
        <h1>Bem-vindo(a) de volta à <strong class="name-enterprise">SorrisoVida</strong></h1>
        <p>Acesse sua conta para gerenciar suas consultas.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <!-- E-mail -->
        <div class="form-group mb-3">
          <label for="loginEmail">E-mail</label>
          <input
            id="loginEmail"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="seu.email@exemplo.com"
            [class.is-invalid]="email?.invalid && email?.touched"
          />
          <div *ngIf="email?.errors?.['required'] && email?.touched" class="invalid-feedback">
            O e-mail é obrigatório.
          </div>
          <div *ngIf="email?.errors?.['email'] && email?.touched" class="invalid-feedback">
            Por favor, insira um formato de e-mail válido.
          </div>
        </div>

        <!-- Senha -->
        <div class="form-group mb-4">
          <label for="loginSenha">Senha</label>
          <input
            id="loginSenha"
            type="password"
            class="form-control"
            formControlName="senha"
            placeholder="Sua senha"
            [class.is-invalid]="senha?.invalid && senha?.touched"
          />
          <div *ngIf="senha?.invalid && senha?.touched" class="invalid-feedback">
            A senha é obrigatória.
          </div>
        </div>
        
        <div class="text-end mb-4">
          <a routerLink="/auth/forgot-password" class="small">Esqueceu a senha? Recupere aqui!</a>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loginForm.invalid">Entrar</button>
        
        <a routerLink="/auth/register" class="d-block text-center mt-3">
          Não possui uma conta? <strong>Cadastre-se</strong>
        </a>
      </form>
    </div>
  </div>
</div>
