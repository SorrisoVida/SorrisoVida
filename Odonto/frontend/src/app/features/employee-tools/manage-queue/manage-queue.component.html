<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Gerenciar Fila de Atendimento</h1>
      <p class="lead text-muted">Chame o próximo paciente ou gerencie a fila de espera.</p>
    </div>
    <a routerLink="/dashboard/funcionario" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-2"></i>Voltar ao Painel
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Fila de Espera</h4>
      <button class="btn btn-primary" (click)="callNext()" [disabled]="queue.length === 0">
        <i class="bi bi-megaphone-fill me-2"></i>Chamar Próximo
      </button>
    </div>
    <div class="card-body">
      <div *ngIf="isLoading" class="text-center p-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>

      <ul *ngIf="!isLoading && queue.length > 0" class="list-group">
        <li *ngFor="let patient of queue; let i = index" 
            class="list-group-item d-flex justify-content-between align-items-center"
            [ngClass]="{'list-group-item-primary': i === 0}">
          <div>
            <span class="fw-bold me-3">{{ i + 1 }}º</span>
            <span>{{ patient.name }}</span>
          </div>
          <small class="text-muted">Chegou às {{ patient.arrivalTime | date:'HH:mm' }}</small>
        </li>
      </ul>

      <div *ngIf="!isLoading && queue.length === 0" class="alert alert-info">A fila de espera está vazia.</div>
    </div>
  </div>
</div>
