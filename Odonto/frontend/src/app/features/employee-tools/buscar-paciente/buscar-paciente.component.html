<div class="container my-5">
  <!-- Cabeçalho e Botão Voltar -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Buscar Paciente</h1>
      <p class="lead text-muted">Encontre o prontuário de um paciente por nome ou CPF.</p>
    </div>
    <button class="btn btn-outline-primary" (click)="navigationService.navigateBackToDashboard()">
      <i class="bi bi-arrow-left me-2"></i>Voltar ao Painel
    </button>
  </div>

  <!-- Barra de Busca -->
  <div class="row mb-4">
    <div class="col-md-8 mx-auto">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" placeholder="Digite o nome ou CPF do paciente..." 
               [(ngModel)]="searchTerm" (input)="filterPatients()">
      </div>
    </div>
  </div>

  <!-- Resultados da Busca -->
  <div class="row">
    <div class="col-12">
      <div *ngIf="filteredPatients.length > 0; else noResults" class="list-group">
        <div *ngFor="let patient of filteredPatients" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">{{ patient.nome }}</h5>
            <p class="mb-1 text-muted">CPF: {{ patient.cpf }} | Última Consulta: {{ patient.ultimaConsulta | date:'dd/MM/yyyy' }}</p>
          </div>
          <a [routerLink]="['/employee/prontuario', patient.id]" class="btn btn-secondary">
            <i class="bi bi-journal-text me-2"></i>Ver Prontuário
          </a>
        </div>
      </div>
      <ng-template #noResults>
        <div class="text-center p-5 border rounded bg-light">
          <p class="text-muted mb-0">Nenhum paciente encontrado com o termo "{{ searchTerm }}".</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
