<div class="container my-5">
  <!-- Cabeçalho e Botão Voltar -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Preencher Prontuário</h1>
      <p class="lead text-muted">Adicione os detalhes do atendimento realizado.</p>
    </div>
    <button class="btn btn-outline-primary" (click)="goBack()">
      <i class="bi bi-arrow-left me-2"></i>Voltar para Pendências
    </button>
  </div>

  <!-- Detalhes da Consulta -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">Detalhes da Consulta</h5>
    </div>
    <div class="card-body">
      <p><strong>Paciente:</strong> {{ chart.patientName }}</p>
      <p><strong>Serviço:</strong> {{ chart.service }}</p>
      <p><strong>Data:</strong> {{ chart.appointmentDate | date:'fullDate' }}</p>
    </div>
  </div>

  <!-- Formulário de Preenchimento -->
  <form>
    <div class="card">
      <div class="card-body">
        <div class="mb-3">
          <label for="anamnese" class="form-label">Anamnese / Observações Iniciais</label>
          <textarea class="form-control" id="anamnese" rows="3" placeholder="Paciente relatou..."></textarea>
        </div>
        <div class="mb-3">
          <label for="procedimento" class="form-label">Procedimento Realizado</label>
          <textarea class="form-control" id="procedimento" rows="5" placeholder="Foi realizado o procedimento de..."></textarea>
        </div>
        <div class="mb-3">
          <label for="prescricao" class="form-label">Prescrição / Recomendações</label>
          <textarea class="form-control" id="prescricao" rows="3" placeholder="Prescrito o uso de... Recomenda-se..."></textarea>
        </div>
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-secondary me-2" (click)="goBack()">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save-fill me-2"></i>Salvar Prontuário
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
