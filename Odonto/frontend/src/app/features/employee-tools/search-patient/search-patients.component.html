<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="display-6">Buscar Pacientes</h1>
      <p class="lead text-muted">Encontre pacientes por nome ou CPF.</p>
    </div>
    <a routerLink="/dashboard/funcionario" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-2"></i>Voltar ao Painel
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-header">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Digite o nome ou CPF do paciente..." #searchInput (keyup.enter)="search(searchInput.value)">
        <button class="btn btn-primary" type="button" (click)="search(searchInput.value)">
          <i class="bi bi-search"></i> Buscar
        </button>
      </div>
    </div>
    <div class="card-body">
      <div *ngIf="isLoading" class="text-center p-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>

      <div *ngIf="!isLoading && searchPerformed && results.length > 0" class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let patient of results">
              <td>{{ patient.name }}</td>
              <td>{{ patient.cpf }}</td>
              <td>{{ patient.phone }}</td>
              <td>
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil-square"></i> Ver/Editar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="!isLoading && searchPerformed && results.length === 0" class="alert alert-warning">
        Nenhum paciente encontrado com o termo "{{ lastSearchTerm }}".
      </div>
    </div>
  </div>
</div>
