<div class="agendamento-container">
  <div class="form-box">
    <div class="mb-3">
      <button class="btn btn-outline-primary w-10 return" (click)="navigationService.navigateBackToDashboard()">
        <i class="bi bi-arrow-left me-2"></i>Voltar
      </button>
    </div>
    <h2>Agendar Nova Consulta</h2>
    <p>Selecione o serviço, o profissional e a data desejada.</p>

    <form (ngSubmit)="onSubmit()">
      <!-- Mensagem de erro -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <!-- SELETOR DE PACIENTE (APENAS PARA ATENDENTE) -->
      <div *ngIf="isAtendente" class="form-group">
        <label for="paciente" class="form-label">Paciente</label>
        <select class="form-select" id="paciente" name="paciente" [(ngModel)]="pacienteSelecionadoId" required>
          <option [ngValue]="null" disabled>Selecione o paciente...</option>
          <option *ngFor="let paciente of pacientes" [value]="paciente.id">
            {{ paciente.nome }}
          </option>
        </select>
      </div>


      <div class="form-group">
        <label for="servico" class="form-label">Serviço / Especialidade</label>
        <select id="servico" class="form-select" [(ngModel)]="servicoSelecionado" name="servico" required autocomplete="off">
          <option [ngValue]="''" disabled>Escolha um serviço...</option>
          <option>Limpeza Dental</option>
          <option>Extração</option>
          <option>Clareamento</option>
          <option>Implante</option>
          <option>Avaliação</option>
        </select>
      </div>
      <div class="form-group">
        <label for="profissional" class="form-label">Selecione o Profissional</label>
        <select id="profissional" class="form-select" [(ngModel)]="profissionalSelecionado" name="profissional" required autocomplete="off"
          (change)="onFilterChange()" [disabled]="carregandoProfissionais">
          <ng-container *ngIf="carregandoProfissionais; else profissionaisLoaded">
            <option>Carregando...</option>
          </ng-container>
          <ng-template #profissionaisLoaded>
            <option [ngValue]="null" disabled>Selecione um profissional...</option>
            <option *ngFor="let profissional of profissionais; trackBy: trackByProfissional" [value]="profissional.id">
              {{ profissional.nome }}
            </option>
          </ng-template>
        </select>
      </div>
      <div class="form-group">
        <label for="data" class="form-label">Data Desejada</label>
        <input id="data" type="date" class="form-control" [(ngModel)]="dataSelecionada" name="data" required autocomplete="off"
          (change)="onFilterChange()" />
      </div>
      <div class="form-group">
        <label id="horarios-label" class="form-label">Horários Disponíveis</label>
        <div *ngIf="!carregandoHorarios; else horariosLoading" class="horarios-wrapper" aria-labelledby="horarios-label">
          <div *ngIf="horariosDisponiveis.length > 0; else noHorarios" class="horarios">
            <button *ngFor="let horario of horariosDisponiveis" type="button" class="hora"
              [class.ativo]="horario === horarioSelecionado" (click)="selecionarHorario(horario)">
              {{ horario }}
            </button>
          </div>
          <ng-template #noHorarios>
            <p class="text-muted">Nenhum horário disponível para esta data/profissional.</p>
          </ng-template>
        </div>
        <ng-template #horariosLoading>
          <p class="text-muted">Carregando horários...</p>
        </ng-template>
      </div>

      <button type="submit" class="btn btn-primary btn-confirmar w-100 mt-4">Confirmar Agendamento</button>
    </form>
    
  </div>
</div>
