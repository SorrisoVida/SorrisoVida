<div class="agendamento-container">
  <div class="form-box">
    <h2>Agendar Nova Consulta</h2>
    <p>Selecione o serviço, o profissional e a data desejada.</p>

    <form>
      <div class="form-group">
        <label for="servico" class="form-label">Serviço / Especialidade</label>
        <select id="servico" class="form-select" [(ngModel)]="servicoSelecionado" name="servico">
          <option selected>Escolha um serviço...</option>
          <option>Limpeza Dental</option>
          <option>Extração</option>
          <option>Clareamento</option>
          <option>Implante</option>
        </select>
      </div>
      <div class="form-group">
        <label for="profissional" class="form-label">Selecione o Profissional</label>
        <select id="profissional" class="form-select" 
                [(ngModel)]="profissionalSelecionado" name="profissional" 
                (change)="onFilterChange()" 
                [disabled]="carregandoProfissionais">
          <option *ngIf="carregandoProfissionais">Carregando...</option>
          <ng-container *ngIf="!carregandoProfissionais">
            <option [ngValue]="null">Qualquer profissional</option>
            <option *ngFor="let profissional of profissionais" [value]="profissional.id">
              {{ profissional.nome }}
            </option>
          </ng-container>
        </select>
      </div>
      <div class="form-group">
        <label for="data" class="form-label">Data Desejada</label>
        <input id="data" type="date" class="form-control" [(ngModel)]="dataSelecionada" name="data" (change)="onFilterChange()" />
      </div>
      <div class="form-group">
        <label class="form-label">Horários Disponíveis</label>
        <div *ngIf="!carregandoHorarios; else loadingTemplate" class="horarios">
          <button 
            *ngFor="let horario of horariosDisponiveis" 
            type="button" 
            class="hora"
            [class.ativo]="horario === horarioSelecionado"
            (click)="selecionarHorario(horario)">
            {{ horario }}
          </button>
        </div>
        <div *ngIf="!carregandoHorarios && horariosDisponiveis.length === 0 && dataSelecionada && profissionalSelecionado">
          <p class="text-muted">Nenhum horário disponível para esta data/profissional. Por favor, tente outra combinação.</p>
        </div>
        <ng-template #loadingTemplate>
          <p class="text-muted">Carregando horários...</p>
        </ng-template>
      </div>
      <button type="submit" class="btn btn-primary w-100">Confirmar Agendamento</button>
    </form>
  </div>
</div>
