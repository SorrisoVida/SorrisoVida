<div class="container mt-5 mb-5">
  <div class="row">
    <div class="col-lg-8 offset-lg-2">
      <div class="card shadow-sm">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Entre em Contato</h2>
          <p class="text-center mb-4">
            Tem alguma dúvida ou gostaria de agendar uma avaliação? Preencha o formulário abaixo ou entre em contato por um de nossos canais.
          </p>

          <div class="row">
            <div class="col-md-6">
              <h5 class="mb-3">Nossos Canais</h5>
              <p><i class="bi bi-telephone-fill me-2"></i> (11) 99999-8888</p>
              <p><i class="bi bi-envelope-fill me-2"></i> contato@sorrisovida.com.br</p>
              <p><i class="bi bi-geo-alt-fill me-2"></i> Rua das Flores, 123 - São Paulo, SP</p>
            </div>
            <div class="col-md-6">
              <form>
                <div class="mb-3">
                  <label for="name" class="form-label">Nome</label>
                  <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Mensagem</label>
                  <textarea class="form-control" id="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar Mensagem</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
