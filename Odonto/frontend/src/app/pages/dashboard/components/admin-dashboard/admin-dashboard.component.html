<div class="dashboard-container container-fluid my-4">
  <div class="row g-4">
    <!-- Widgets para ADMIN -->
    <div class="col-md-6 col-lg-4">
      <div class="card text-white bg-success h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-cash-coin me-2"></i>Faturamento do Mês</h5>
          <p class="display-4 fw-bold">{{ faturamentoDoMes | currency:'BRL' }}</p>
          <a routerLink="/under-construction" class="btn btn-light btn-sm">Ver Relatórios</a>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title"><i class="bi bi-person-plus-fill me-2"></i>Cadastros Pendentes</h5>
          <p class="display-4 fw-bold">{{ cadastrosPendentes }}</p>
          <p class="card-text">Novos usuários aguardando aprovação.</p>
          <a routerLink="/under-construction" class="btn btn-primary">Analisar Cadastros</a>
        </div>
      </div>
    </div>
  </div>
</div>
