<div class="profile-container container my-5">
  <!-- Notificação Toast -->
  <div class="toast-notification" [class.show]="showSuccessToast">
    <i class="bi bi-check-circle-fill me-2"></i>
    {{ toastMessage || 'Operação realizada com sucesso!' }}
  </div>

  <!-- Botão Voltar e Mensagem de Sucesso -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-outline-primary" (click)="navigateBackToDashboard()">
      <i class="bi bi-arrow-left me-2"></i>Voltar ao Painel
    </button>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0"><i class="bi bi-person-circle me-2"></i>Meu Perfil</h4>
          <button class="btn btn-light btn-sm" (click)="toggleEdit()" *ngIf="!isAdmin">
            <i [class]="isEditing ? 'bi bi-x-lg' : 'bi bi-pencil-fill'"></i>
            {{ isEditing ? 'Cancelar' : 'Editar' }}
          </button>
        </div>
        <div class="card-body p-4">
          <h5 class="section-title">Informações Pessoais</h5>
          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="row g-3 mb-3">
              <!-- Informações Comuns -->
              <div class="col-md-6 mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" formControlName="nome">
              </div>
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" formControlName="email">
              </div>

              <!-- Informações do Paciente -->
              <ng-container *ngIf="isPatient">
                <div class="col-md-6 mb-3">
                  <label for="telefone" class="form-label">Telefone</label>
                  <input type="text" id="telefone" class="form-control" formControlName="telefone">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Plano de Saúde</label>
                  <input type="text" class="form-control" value="Não informado" [disabled]="!isEditing">
                </div>
              </ng-container>

              <!-- Informações do Dentista -->
              <ng-container *ngIf="isDentista">
                <div class="col-md-6 mb-3">
                  <label for="especialidade" class="form-label">Especialidade</label>
                  <input type="text" id="especialidade" class="form-control" formControlName="especialidade">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">CRO</label>
                  <input type="text" class="form-control" value="SP-12345" [disabled]="!isEditing">
                </div>
              </ng-container>

              <!-- Informações do Atendente -->
              <ng-container *ngIf="isAtendente">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Departamento</label>
                  <input type="text" class="form-control" value="Recepção" [disabled]="!isEditing">
                </div>
              </ng-container>

              <!-- Informações do Admin -->
              <ng-container *ngIf="isAdmin">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Nível de Acesso</label>
                  <input type="text" class="form-control" value="Administrador Global" disabled>
                </div>
              </ng-container>
            </div>

            <!-- Seção de Segurança -->
            <hr class="my-4">
            <h5 class="section-title">Segurança</h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="senhaAtual" class="form-label">Senha Atual</label>
                <input type="password" id="senhaAtual" class="form-control" formControlName="senhaAtual" placeholder="Digite sua senha atual">
              </div>
              <div class="col-md-4">
                <label for="novaSenha" class="form-label">Nova Senha</label>
                <input type="password" id="novaSenha" class="form-control" formControlName="novaSenha">
              </div>
              <div class="col-md-4">
                <label for="confirmarNovaSenha" class="form-label">Confirmar Nova Senha</label>
                <input type="password" id="confirmarNovaSenha" class="form-control" formControlName="confirmarNovaSenha" 
                       [class.is-invalid]="profileForm.hasError('mismatch') && profileForm.get('confirmarNovaSenha')?.touched">
                <div *ngIf="profileForm.hasError('mismatch') && profileForm.get('confirmarNovaSenha')?.touched" class="invalid-feedback">
                  As senhas não coincidem.
                </div>
              </div>
            </div>
            <div class="mt-3 text-end">
              <a routerLink="/auth/forgot-password" class="forgot-password-link">
                Esqueceu sua senha?
              </a>
            </div>

            <!-- Seção de Preferências -->
            <ng-container *ngIf="isPatient">
              <hr class="my-4">
              <h5 class="section-title">Preferências de Comunicação</h5>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="notificacoesEmail" [disabled]="!isEditing" checked>
                <label class="form-check-label" for="notificacoesEmail">
                  Receber notificações e lembretes de consultas por e-mail.
                </label>
              </div>
              <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" role="switch" id="notificacoesSms" [disabled]="!isEditing">
                <label class="form-check-label" for="notificacoesSms">
                  Receber lembretes de consultas por SMS (quando disponível).
                </label>
              </div>
            </ng-container>

            <div *ngIf="isEditing" class="mt-4 text-end">
              <button type="submit" class="btn btn-secondary" [disabled]="profileForm.invalid || !hasChanges">
                <i class="bi bi-check-circle-fill me-2"></i>Salvar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
