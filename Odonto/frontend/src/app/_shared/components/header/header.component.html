<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" [routerLink]="['/home']">
      <img src="/assets/images/logo.png" alt="Logo da Sorriso Vida" width="55" height="55" class="me-2">
      <h1>SorrisoVida</h1>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links do menu -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Agrupador para alinhar links e botões à direita -->
      <div class="d-flex align-items-center ms-auto">
        <ul class="navbar-nav mb-2 mb-lg-0 gap-3 me-4">
          <li class="nav-item">
            <a class="nav-link fw-medium" [routerLink]="['/under-construction']" >Sobre nós</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-medium"  [routerLink]="['/under-construction']">Contato</a>




          </li>
          <!-- Apenas para usuários autenticados -->
          @if (authService.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link fw-medium" [routerLink]="['/dashboard']">Dashboard</a>
          </li>
          }
        </ul>
  
        <!-- Botões de Autenticação e Menu do Usuário -->
        <div class="d-flex gap-3 align-items-center">
          @if (!authService.isAuthenticated()) {
          <!-- Se não estiver autenticado, mostra Login e Cadastro -->
            <a [routerLink]="['/auth/login']" class="btn btn-outline-light">Entrar</a>
            <a [routerLink]="['/auth/register']" class="btn btn-light">Cadastrar-se</a>
          } @else {
          <!-- Se estiver autenticado, mostra o menu dropdown -->
            <div bsDropdown [autoClose]="true">
              <a href="javascript:void(0)" class="nav-link dropdown-toggle d-flex align-items-center" id="button-basic" bsDropdownToggle>
                <span class="text-white fw-medium">{{ user?.nome || 'Minha conta' }}</span>
                <i class="bi bi-person-circle fs-4 ms-2 text-white"></i>
              </a>
              <ul *bsDropdownMenu class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="button-basic">
                <li><a class="dropdown-item" [routerLink]="['/under-construction']">Perfil</a></li>
                <li><a class="dropdown-item" [routerLink]="['/under-construction']">Minhas Consultas</a></li>
                <li><a class="dropdown-item" [routerLink]="['/schedule']">Agendar Consulta</a></li>
                <li><a class="dropdown-item" [routerLink]="['/under-construction']">Favoritos</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><button class="dropdown-item text-danger" (click)="logout()">Sair</button></li>
              </ul>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</nav>
