<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente - DentaCare</title>
    
    <link rel="stylesheet" href="styleCadastro.css">
</head>
<body>

    <div class="form-container">
        <h3 class="form-title">Crie sua Conta SorrisoVida</h3>
        <p class="form-subtitle">Preencha seus dados para agendar sua primeira consulta.</p>

        <form class="register-form" method="POST" action="processa_cadastro.php">
            <div class="form-group">
                <label for="full-name">Nome Completo</label>
                <input type="text" id="full-name" name="fullName" required placeholder="Seu nome completo">
            </div>
            
            <div class="form-group">
                <label for="phone">Telefone</label>
                <input type="tel" id="phone" name="phone" required placeholder="(99) 99999-9999">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Criar Senha</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar Senha</label>
                <input type="password" id="confirm-password" name="confirmPassword" required placeholder="Repita a senha">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Li e concordo com os **Termos de Uso**.</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="cta-button primary-submit">
                    Finalizar Cadastro
                </button>
            </div>
        </form>
    </div>

    <script src="scrpitCadastro.js"></script>
</body>
</html>
